name: Daily Tech Blog Automation

on:
  schedule:
    # Runs at 9:00 AM UTC Monday–Friday (weekdays only)
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Draft Blog Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generateBlog.js

      - name: Create Pull Request for Review
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "draft: new blog post for review"
          branch: "blog/draft-${{ github.run_id }}"
          delete-branch: true
          title: "Draft: New Blog Post — Review Before Publishing"
          body: |
            ## Blog Draft Ready for Review

            A new draft blog post has been generated. **Do not merge without reviewing.**

            ### Review checklist before merging:
            - [ ] Read the full post — does it add genuine value?
            - [ ] Remove or rewrite any generic/templated-sounding sections
            - [ ] Add a personal anecdote, real-world example, or opinion that only you could write
            - [ ] Check the title is unique (not a near-duplicate of existing posts)
            - [ ] Verify all code examples compile/run correctly
            - [ ] Change `isPublished: false` → `isPublished: true` only after editing
            - [ ] Update the description to be specific, not generic

            > Posts merge with `isPublished: false` — they won't go live until you manually set it to `true`.
          labels: "blog-draft,needs-review"
          draft: false
